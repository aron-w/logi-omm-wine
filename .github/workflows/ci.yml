name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Check shell runtime contract
        run: |
          bash -n bin/omme bin/omme-init bin/omme-init-gui bin/omme-debug tests/runtime-contract.sh
          tests/runtime-contract.sh
      - name: Check distro install dry-run
        run: make -n install DESTDIR=/tmp/omme-pkg PREFIX=/usr UDEVDIR=/usr/lib/udev/rules.d
      - name: Check flake
        run: nix flake check
      - name: Build package
        run: nix build .#
